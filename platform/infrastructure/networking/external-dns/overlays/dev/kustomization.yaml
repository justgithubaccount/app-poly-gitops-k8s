apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  # A token sealed for the deleted cluster cannot be decrypted by a new cluster.
  - patch: |-
      apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        name: cloudflare-token
        namespace: external-dns
      $patch: delete
  - target:
      kind: Application
      name: external-dns
    patch: |-
      - op: replace
        path: /spec/source/helm/values
        value: |-
          provider:
            name: cloudflare
          sources:
            - ingress
          domainFilters:
            - syncjob.ru
          extraArgs:
            - --annotation-filter=external-dns.alpha.kubernetes.io/enabled=true
          policy: upsert-only
          registry: txt
          txtOwnerId: app-poly-gitops-dev
          txtPrefix: _external-dns.
          logLevel: info
          env:
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-token
                  key: CF_API_TOKEN
