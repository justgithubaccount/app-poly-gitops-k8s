apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argocd-image-updater
    targetRevision: 0.12.3
    helm:
      values: |
        config:
          argocd:
            serverAddress: "argocd-server.argocd.svc.cluster.local:80"
            insecure: true
            plaintext: true

          registries:
            - name: ghcr
              api_url: https://ghcr.io
              prefix: ghcr.io

        metrics:
          enabled: true
          port: 8080

        serviceAccount:
          create: true

        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
  destination:
    name: CLUSTER
    namespace: argocd
  syncPolicy:
    automated:
      allowEmpty: true
      selfHeal: true
      prune: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PruneLast=true
