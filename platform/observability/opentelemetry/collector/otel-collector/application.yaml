apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vector-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: https://helm.vector.dev
      chart: vector
      targetRevision: 0.60.0
      helm:
        valueFiles:
          - $values/platform/observability/opentelemetry/collector/otel-collector/values.yaml
    - repoURL: https://github.com/justgithubaccount/app-poly-gitops-k8s
      targetRevision: v1.4.0
      ref: values
  destination:
    name: CLUSTER
    namespace: observability
  syncPolicy:
    automated:
      allowEmpty: true
      selfHeal: true
      prune: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PruneLast=true
