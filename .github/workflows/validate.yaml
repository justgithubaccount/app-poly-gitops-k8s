name: Validate K8s Manifests

env:
  OPA_VERSION: '1.22.0'
  KUBECONFORM_VERSION: '0.8.0'

on:
  pull_request:
    paths:
      - 'platform/**'
      - 'clusters/**'
      - 'tenants/**'
      - 'policies/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.releaserc.json'
      - 'README.md'
      - 'docs/**'
      - '.claude/CLAUDE.md'
      - '.github/workflows/release.yaml'
      - '.github/workflows/validate.yaml'

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js release toolchain
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Validate release dependencies
        run: npm ci --ignore-scripts

      - name: Reject critical dependency vulnerabilities
        run: npm audit --audit-level=critical

      - name: Validate release notes generation
        run: node tests/test_release_notes.mjs

      - name: Validate application contracts
        run: |
          bash tests/test_chat_contract.sh
          bash tests/test_crewai_contract.sh
          bash tests/test_dev_contract.sh
          bash tests/test_vector_config.sh

      - name: Create manifest validation environment
        run: |
          python3 -m venv "${RUNNER_TEMP}/manifest-validation"
          "${RUNNER_TEMP}/manifest-validation/bin/python" -m pip install 'PyYAML==6.0.2'

      - name: Validate GitOps ownership contracts
        run: |
          "${RUNNER_TEMP}/manifest-validation/bin/python" tests/test_gitops_ownership.py -v

      - name: Validate pinned manifest tooling
        run: |
          "${RUNNER_TEMP}/manifest-validation/bin/python" tests/test_validation_tool_pins.py -v

      - name: Validate public dev networking
        run: |
          "${RUNNER_TEMP}/manifest-validation/bin/python" tests/test_dev_networking.py

      - name: Setup OPA
        run: |
          curl --fail --location --silent --show-error --remote-name \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64"
          curl --fail --location --silent --show-error --remote-name \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64.sha256"
          sha256sum --check opa_linux_amd64.sha256
          chmod +x opa_linux_amd64 && sudo mv opa_linux_amd64 /usr/local/bin/opa

      - name: Validate OPA policies
        run: opa check policies/

      - name: Validate OPA multi-document handling
        run: |
          "${RUNNER_TEMP}/manifest-validation/bin/python" tests/test_opa_multidoc.py -v

  render:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, smoke]
    steps:
      - uses: actions/checkout@v4

      - name: Create manifest validation environment
        run: |
          python3 -m venv "${RUNNER_TEMP}/manifest-validation"
          "${RUNNER_TEMP}/manifest-validation/bin/python" -m pip install 'PyYAML==6.0.2'

      - name: Setup manifest validation tools
        run: |
          curl --fail --location --silent --show-error --remote-name \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error --remote-name \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/CHECKSUMS"
          grep ' kubeconform-linux-amd64.tar.gz$' CHECKSUMS | sha256sum --check -
          tar -xf kubeconform-linux-amd64.tar.gz && sudo mv kubeconform /usr/local/bin

          curl --fail --location --silent --show-error --remote-name \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64"
          curl --fail --location --silent --show-error --remote-name \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64.sha256"
          sha256sum --check opa_linux_amd64.sha256
          chmod +x opa_linux_amd64 && sudo mv opa_linux_amd64 /usr/local/bin/opa

      - name: Validate Kustomize
        run: |
          kubectl kustomize clusters/${{ matrix.env }}/ > rendered.yaml

      - name: Save rendered manifest as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifest-${{ matrix.env }}-${{ github.run_number }}
          path: rendered.yaml

      - name: Kubeconform validation
        run: |
          kubeconform -summary -strict \
            -skip Application,ApplicationSet,Certificate,ClusterIssuer,SealedSecret,PostgresCluster,Cluster \
            rendered.yaml

      - name: OPA policy check
        run: |
          "${RUNNER_TEMP}/manifest-validation/bin/python" \
            scripts/validate_opa_manifests.py rendered.yaml policies/
