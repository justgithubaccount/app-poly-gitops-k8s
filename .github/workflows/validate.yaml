name: Validate K8s Manifests

on:
  pull_request:
    paths:
      - 'platform/**'
      - 'clusters/**'
      - 'tenants/**'
      - 'policies/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.releaserc.json'
      - '.github/workflows/release.yaml'
      - '.github/workflows/validate.yaml'

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, smoke]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js release toolchain
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Validate release dependencies
        run: npm ci --ignore-scripts

      - name: Validate release notes generation
        run: node tests/test_release_notes.mjs

      - name: Validate application contracts
        run: |
          bash tests/test_chat_contract.sh
          bash tests/test_crewai_contract.sh
          bash tests/test_dev_contract.sh
          bash tests/test_vector_config.sh

      - name: Validate public dev networking
        run: |
          python3 -m venv "${RUNNER_TEMP}/manifest-validation"
          "${RUNNER_TEMP}/manifest-validation/bin/python" -m pip install 'PyYAML==6.0.2'
          "${RUNNER_TEMP}/manifest-validation/bin/python" tests/test_dev_networking.py

      - name: Setup tools
        run: |
          curl -LO https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xf kubeconform-linux-amd64.tar.gz && sudo mv kubeconform /usr/local/bin

          curl -LO https://openpolicyagent.org/downloads/latest/opa_linux_amd64
          chmod +x opa_linux_amd64 && sudo mv opa_linux_amd64 /usr/local/bin/opa

      - name: Validate OPA multi-document handling
        run: |
          "${RUNNER_TEMP}/manifest-validation/bin/python" tests/test_opa_multidoc.py -v

      - name: Validate Kustomize
        run: |
          kubectl kustomize clusters/${{ matrix.env }}/ > rendered.yaml

      - name: Save rendered manifest as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifest-${{ matrix.env }}-${{ github.run_number }}
          path: rendered.yaml

      - name: Kubeconform validation
        run: |
          kubeconform -summary -strict \
            -skip Application,ApplicationSet,Certificate,ClusterIssuer,SealedSecret,PostgresCluster,Cluster \
            rendered.yaml

      - name: OPA policy check
        run: |
          "${RUNNER_TEMP}/manifest-validation/bin/python" \
            scripts/validate_opa_manifests.py rendered.yaml policies/
