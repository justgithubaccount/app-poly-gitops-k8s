apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chat-api
  namespace: argocd
  labels:
    app.kubernetes.io/name: chat-api
    app.kubernetes.io/part-of: chat
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://github.com/justgithubaccount/app-poly-gitops-helm
    targetRevision: v0.4.1
    path: .
    helm:
      valueFiles:
        - values.yaml
  destination:
    name: in-cluster
    namespace: chat-api
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
