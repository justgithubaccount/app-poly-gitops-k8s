apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: Application
      name: chat-api
    patch: |
      - op: add
        path: /metadata/labels/env
        value: dev
      - op: replace
        path: /spec/source/helm/valueFiles
        value:
          - values.yaml
      - op: add
        path: /spec/source/helm/values
        value: |
          image:
            repository: ghcr.io/justgithubaccount/app-poly-gitops-fastapi
            tag: "1.1.2"
          replicaCount: 1
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          ingress:
            enabled: false
            host: chat-dev.syncjob.ru
          env:
            OTEL_EXPORTER_OTLP_ENDPOINT: http://vector-gateway.observability.svc.cluster.local:4318
            OTEL_TRACES_EXPORTER: otlp
            OTEL_LOGS_EXPORTER: otlp
          openrouter:
            apiUrl: https://api.openai.com/v1/chat/completions
            defaultModel: gpt-4o-mini
          postgresSecretRefName: ""
          openrouterSecretRefName: chat-openrouter
