image:
  repository: ghcr.io/justgithubaccount/app-poly-gitops-fastapi
  tag: "1.1.2"

replicaCount: 1

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

ingress:
  enabled: true
  host: chat-dev.syncjob.ru

# Disable the chart-managed Postgres secret; CloudNativePG creates it.
postgresSecretRefName: ""
openrouterSecretRefName: chat-openrouter

# Use the CloudNativePG-generated secret for DATABASE_URL.
extraEnv:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: chat-db-cnpg-app
        key: uri
