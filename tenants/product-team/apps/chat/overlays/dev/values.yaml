image:
  repository: ghcr.io/justgithubaccount/app-poly-gitops-fastapi
  tag: "1.1.1"

replicaCount: 2

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: true
  host: chat-dev.syncjob.ru

# Disable SealedSecret for postgres (using PGO instead)
postgresSecretRefName: ""
openrouterSecretRefName: chat-openrouter

# Use PGO-generated secret for DATABASE_URL
extraEnv:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: chat-db-pguser-chatapi
        key: uri
