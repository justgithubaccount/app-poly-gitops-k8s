apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crewai-observer
  labels:
    app.kubernetes.io/name: crewai
    app.kubernetes.io/part-of: auto-k8s-pilot
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - endpoints
      - events
      - namespaces
      - nodes
      - persistentvolumeclaims
      - pods
      - pods/log
      - services
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources:
      - applications
      - applicationsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
      - pods
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crewai-observer
  labels:
    app.kubernetes.io/name: crewai
    app.kubernetes.io/part-of: auto-k8s-pilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crewai-observer
subjects:
  - kind: ServiceAccount
    name: crewai
    namespace: crewai-system
