apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Namespaces must exist before child applications reconcile.
  - ../../platform/core/namespaces
  # Public dev web entrypoints, automatic Cloudflare DNS and per-namespace TLS.
  - ../../platform/infrastructure/networking/nginx/overlays/dev
  - ../../platform/infrastructure/networking/cert-manager/overlays/dev
  - ../../platform/infrastructure/networking/external-dns/overlays/dev
  # Observability
  - ../../platform/observability/monitoring/loki
  - ../../platform/observability/monitoring/grafana
  - ../../platform/observability/opentelemetry/collector/otel-collector
  # GitOps
  - ../../platform/gitops/argocd-image-updater
  # Tenants
  - ../../tenants/product-team/apps/chat/overlays/dev
  - ../../tenants/product-team/apps/crewai/base

patches:
  # Target every child application at the local cluster.
  - path: destination.yaml
    target:
      kind: Application
  - target:
      kind: Application
      name: grafana
    patch: |-
      - op: replace
        path: /spec/source/helm/values
        value: |-
          # Provisioned once outside Helm: Argo renders must not rotate passwords.
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          service:
            type: ClusterIP
          grafana.ini:
            server:
              domain: grafana.syncjob.ru
              root_url: https://grafana.syncjob.ru
            auth.anonymous:
              enabled: false
          datasources:
            datasources.yaml:
              apiVersion: 1
              datasources:
                - name: Loki
                  type: loki
                  access: proxy
                  url: http://loki.observability.svc.cluster.local:3100
  - target:
      kind: Application
      name: crewai
    patch: |-
      - op: replace
        path: /spec/source/path
        value: tenants/product-team/apps/crewai/overlays/dev
      - op: replace
        path: /spec/source/targetRevision
        value: v1.4.2
  - target:
      kind: Application
      name: loki
    patch: |-
      - op: replace
        path: /spec/source/helm/values
        value: |-
          deploymentMode: SingleBinary

          singleBinary:
            replicas: 1
            persistence:
              enabled: false
            extraVolumeMounts:
              - name: loki-storage
                mountPath: /var/loki
            extraVolumes:
              - name: loki-storage
                emptyDir: {}
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi

          backend: { replicas: 0 }
          read: { replicas: 0 }
          write: { replicas: 0 }
          ingester: { replicas: 0 }
          querier: { replicas: 0 }
          queryFrontend: { replicas: 0 }
          queryScheduler: { replicas: 0 }
          distributor: { replicas: 0 }
          compactor: { replicas: 0 }
          indexGateway: { replicas: 0 }
          bloomCompactor: { replicas: 0 }
          bloomGateway: { replicas: 0 }

          gateway:
            enabled: false
          lokiCanary:
            enabled: false
          test:
            enabled: false
          resultsCache:
            enabled: false
          chunksCache:
            enabled: false

          loki:
            auth_enabled: false
            commonConfig:
              replication_factor: 1
            limits_config:
              allow_structured_metadata: true
              volume_enabled: true
            schemaConfig:
              configs:
                - from: "2024-04-01"
                  store: tsdb
                  object_store: filesystem
                  schema: v13
                  index:
                    prefix: loki_index_
                    period: 24h
            storage:
              type: filesystem
